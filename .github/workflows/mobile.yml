# Builds the Android app on every push that changes it; download the APK from the run's artifacts.
# Set the repository variable API_BASE (Settings > Secrets and variables > Actions > Variables) to the site address.
name: mobile
on:
  push:
    paths: ["apps/mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - run: bash setup.sh
      - run: flutter analyze --no-fatal-infos
      - run: flutter build apk --release --dart-define=API_BASE=${{ vars.API_BASE || 'http://10.0.2.2:8861' }}
      - uses: actions/upload-artifact@v4
        with:
          name: kitchen-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
