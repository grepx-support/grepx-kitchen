# The one registry of runnable services (manage.py reads it). enabled = false keeps a service out of "all".
# ports = first-last: the range the service's health / HTTP endpoint may use. Kitchen uses 93xx / 94xx / 886x so it can
# run on the same machine as another product (blood donation uses 88xx / 89xx / 91xx / 8851).

[nexus-server]
path = platform/nexus-server
project = platform
enabled = true

