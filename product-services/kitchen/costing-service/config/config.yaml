service_name: costing-service
snapshot_table: costing_requests
project: kitchen
description: "Cost of goods sold for every count period (ingredient cost used / sales), costing average with labour, rent and other costs, acceptable COGS range alert, monthly summary with net profit that is never shown while a cost line is missing. Keywords: COGS, food cost, margin, profit and loss, P&L, overheads, labour, rent"
owns: [cost_days, overheads]   # tables this service is the system of record for (kept in its own database)
tables:                        # created in this service's own database by setup.sh (table: [indexed fields])
  cost_days: [tenant_id, location_id, date]
  overheads: [tenant_id, location_id, month]
subscriptions:                 # a closing's count was applied to stock: work out that location's cost for the period
  - {table: stock_requests, handler: jobs.handle_count, when: "status = 'ACCEPTED' AND action = 'COUNT'"}
