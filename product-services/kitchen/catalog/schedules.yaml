schedules:
  - {schedule_id: task-reminders, job: task-reminders, target_service: task-service, kind: EVERY_MINUTES, every_minutes: 15}
  - {schedule_id: inventory-alerts, job: inventory-alerts, target_service: inventory-service, kind: EVERY_MINUTES, every_minutes: 60}
  - {schedule_id: billing-reminders, job: billing-reminders, target_service: billing-service, kind: DAILY_AT, at: "01:00"}   # 01:00 UTC = morning in Asia
  - {schedule_id: forecast-keep, job: forecast-keep, target_service: forecast-service, kind: EVERY_MINUTES, every_minutes: 180}   # keeps each day's forecast before the day
  - {schedule_id: notify-retry, job: notify-retry, target_service: notification-service, kind: EVERY_MINUTES, every_minutes: 5}   # failed messages tried again (5 min, 30 min, 2 h)
