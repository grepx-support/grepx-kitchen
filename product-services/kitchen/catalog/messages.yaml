# Message templates for the kitchen product (seeded into template-service). {placeholders} only.
templates:
  welcome:
    label: Welcome for a new user
    placeholders: [first_name, name, org, link]
    subject: "Welcome to {org}, {first_name}"
    text: "Hi {first_name},\n\nYour account for {org} is ready. Sign in on your phone: {link}"
  broadcast:
    label: Message to a group
    placeholders: [first_name, name, org, link, text]
    subject: "{org}"
    text: "Hi {first_name},\n\n{text}"
  stock_alert:
    label: Stock alerts for the owner (low, below zero, expiring, expired)
    placeholders: [first_name, org, count, summary, link]
    channels: [email, whatsapp]          # the default; each business can choose its own (Outbox -> Settings)
    subject: "{org}: {count} stock alert(s)"
    text: "Hi {first_name},\n\n{count} new stock alert(s) today:\n{summary}\n\nSee them all: {link}"
  purchase_order:
    label: Purchase order sent to a supplier
    placeholders: [org, supplier, number, text, link]
    channels: [email, sms, whatsapp]
    subject: "{org} order {number}"
    text: "{text}"
  payslip:
    label: A payslip sent to a team member (the PDF attached)
    placeholders: [org, name, month, net, link]
    channels: [email, whatsapp, sms]
    subject: "{org} payslip for {month}"
    text: "Dear {name},\n\nYour payslip for {month} is attached. Net pay: {net}.\n\n{org}"
  catering_quote:
    label: A catering quotation emailed to a customer (the PDF attached)
    placeholders: [org, customer, number, total, valid_until, event, link]
    channels: [email]
    subject: "Quotation {number} from {org}"
    text: "Dear {customer},\n\nThank you for your enquiry. Please find our quotation {number} for your event on {event}: {total}, valid until {valid_until}.\n\nReply to this email to confirm, or call us with any changes.\n{org}"
  price_jump:
    label: A supplier's price jumped (for the owners)
    placeholders: [first_name, supplier, count, summary, bill, link]
    channels: [email, whatsapp]
    subject: "{supplier} raised {count} price(s)"
    text: "Hi {first_name},\n\n{supplier}'s bill {bill} has higher prices than last time:\n{summary}\n\nCheck it before you approve the bill."
  customer_invoice:
    label: An invoice emailed to a customer
    placeholders: [org, customer, number, total, due, link]
    channels: [email]
    subject: "Invoice {number} from {org}"
    text: "Dear {customer},\n\nPlease find invoice {number} for {total}, due on {due}.\n\nThank you for your business.\n{org}"
  payment_reminder:
    label: A reminder to a customer that an invoice is unpaid
    placeholders: [org, customer, number, due, owed, late, how, link]
    channels: [email]
    subject: "Reminder: invoice {number} from {org}"
    text: "Dear {customer},\n\nOur records show {owed} still owing on invoice {number}, which was due on {due}.\nIf you have already paid, thank you - please ignore this email.\n\n{how}\n\n{org}"
  demo_request:
    label: A demo was requested on the website (to the platform operator)
    placeholders: [org, name, company, email, phone, size, message]
    channels: [email]
    subject: "Demo request: {company}"
    text: "{name} from {company} ({size}) asked for a demo.\nEmail: {email}\nPhone: {phone}\n\n{message}"
