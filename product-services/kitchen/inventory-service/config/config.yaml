service_name: inventory-service
snapshot_table: inventory_requests
project: kitchen
description: "Inventory control: minimum and maximum (par) levels per item and location, daily alerts for low, negative, expiring and expired stock sent to the owners, full stock takes with variance, stock valuation (current cost and by lot), ABC analysis, days of cover and waste by reason. Keywords: par level, reorder point, min max, low stock alert, expiry alert, stock take, cycle count, variance, shrinkage, valuation, FIFO, ABC analysis, days of cover, waste report"
owns: [par_levels, stock_takes, alerts]
tables:
  par_levels: [tenant_id, location_id, item_id]
  stock_takes: [tenant_id, location_id, state]
  alerts: [tenant_id, state, date]
subscriptions:                        # the scheduler's tick: check every business for alerts
  - {table: ticks, handler: jobs.handle_tick, when: "to_service = '{service}' AND status = 'NEW'"}
